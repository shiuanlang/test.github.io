<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股即時看盤</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1c222b;--line:#2a313c;--text:#d6dde8;--muted:#8793a4;--up:#ef4444;--dn:#22c55e;--fl:#d6dde8;--accent:#4f9cf9}
[data-theme=light]{--bg:#eef1f5;--panel:#ffffff;--panel2:#f2f4f8;--line:#dde2ea;--text:#1d2530;--muted:#6b7585;--fl:#1d2530;--accent:#2563eb}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.num,.nm{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--fl)}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{background:#f59e0b;color:#000;border-radius:4px;padding:1px 6px;margin-left:6px;font-size:11px}
.idx{display:flex;gap:16px}
.ix{cursor:pointer;display:flex;gap:8px;align-items:baseline;padding:2px 8px;border-radius:6px}
.ix:hover{background:var(--panel2)}
.ix b{font-weight:600;color:var(--muted)}
.sp{flex:1}
.mkt{color:var(--muted);white-space:nowrap}
.mkt i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--muted)}
.mkt i.o{background:var(--dn)}.mkt i.e{background:var(--up)}
main{flex:1;display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:10px;padding:10px;min-height:0}
aside,.right{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;min-width:0;display:flex;flex-direction:column}
.add{position:relative;padding:10px;border-bottom:1px solid var(--line)}
.add input{width:100%}
.sug{position:absolute;left:10px;right:10px;top:44px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;z-index:5;box-shadow:0 8px 24px #0006;overflow:hidden}
.sug div{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between}
.sug div:hover{background:var(--accent);color:#fff}
.sug small{color:var(--muted)}.sug div:hover small{color:#fff}
.wlwrap{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr.r{cursor:pointer}
tr.r:hover{background:var(--panel2)}
tr.r.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
td .c{color:var(--muted);font-size:11px;margin-left:6px}
td.x{width:24px;padding:0 4px;text-align:center}
td.x span{opacity:0;cursor:pointer;color:var(--muted)}
tr.r:hover td.x span{opacity:1}
td.x span:hover{color:var(--up)}
@keyframes fu{from{background:#ef444455}to{background:transparent}}
@keyframes fd{from{background:#22c55e55}to{background:transparent}}
.flu{animation:fu .9s}.fld{animation:fd .9s}
.lim{font-size:10px;border-radius:3px;padding:0 4px;margin-left:4px;color:#fff}
.lim.u{background:var(--up)}.lim.d{background:var(--dn)}
#head{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;padding:10px 14px 4px}
.hn b{font-size:18px}.hn span{color:var(--muted);margin-left:8px}
.hn em{font-style:normal;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted)}
.hp{font-size:30px;font-weight:700;line-height:1}
.hc{font-size:15px;padding-bottom:2px}
.stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin-left:auto}
.stats div{display:flex;flex-direction:column;align-items:flex-end}
.stats b{color:var(--text);font-weight:500}
#alertBox{display:flex;gap:6px;align-items:center;padding:0 14px 6px;color:var(--muted);flex-wrap:wrap}
#alertBox input{width:84px}
#alertBox .tag{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 8px;cursor:pointer}
.toolbar{display:flex;gap:6px;padding:6px 14px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.toolbar .g{display:flex;gap:4px;margin-right:8px}
.toolbar .g.chips button{padding:2px 8px;font-size:12px}
.cw{flex:1;display:grid;grid-template-columns:1fr 220px;min-height:320px;border-top:1px solid var(--line)}
.cv{position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;cursor:crosshair}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);pointer-events:none;text-align:center;padding:20px}
#side{border-left:1px solid var(--line);overflow:auto;font-size:12px}
.sh{padding:6px 10px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel2)}
.dr{position:relative;display:grid;grid-template-columns:34px 1fr 52px;padding:2px 10px;overflow:hidden}
.dr i{position:absolute;right:0;top:1px;bottom:1px;opacity:.18;background:currentColor}
.dr span{position:relative}
.dr .dl{color:var(--muted)}.dr .dp{text-align:right;padding-right:8px}.dr .dv{text-align:right}
.tk{display:grid;grid-template-columns:62px 1fr 48px;padding:1px 10px}
.tk span:nth-child(2),.tk span:nth-child(3){text-align:right}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:20}
#toast div{background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 8px 24px #0006}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;width:min(760px,94vw);max-height:88vh}
dialog::backdrop{background:#0009}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;background:var(--panel);z-index:2}
.db{padding:6px 18px 18px;overflow:auto;max-height:calc(88vh - 56px)}
.db h4{margin:16px 0 8px;color:var(--accent);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px}
.f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.f input[type=number]{width:70px}
.f input[type=color]{width:34px;height:24px;padding:0;border:none;background:none}
.f label.k{display:flex;align-items:center;gap:6px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.row .n{width:60px;color:var(--muted)}
.row input[type=number]{width:70px}
@media(max-width:1000px){main{grid-template-columns:1fr;overflow:auto}aside{max-height:300px}.cw{grid-template-columns:1fr}#side{display:none}body{overflow:auto}}
</style>
</head>
<body>
<header>
  <div class="brand">📈 台股即時看盤<small id="demoTag" style="display:none">示範資料</small></div>
  <div class="idx" id="idx"></div>
  <div class="sp"></div>
  <div class="mkt" id="mkt"></div>
  <label>更新 <select id="refSel"><option value="2">2 秒</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="20">20 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select></label>
  <button id="btnTheme" title="切換亮/暗色">◐</button>
  <button id="btnSet">⚙ 設定</button>
</header>
<main>
  <aside>
    <div class="add"><input id="addIn" placeholder="新增自選股：輸入代號或名稱 (如 2330、台積電)" autocomplete="off"><div id="sug" class="sug" style="display:none"></div></div>
    <div class="wlwrap"><table id="wl"></table></div>
  </aside>
  <section class="right">
    <div id="head"></div>
    <div id="alertBox"></div>
    <div class="toolbar" id="tb"></div>
    <div class="cw">
      <div class="cv"><canvas id="cv"></canvas><div id="msg"></div></div>
      <div id="side"></div>
    </div>
  </section>
</main>
<dialog id="dlg"><div class="dh"><span>⚙ 看盤與圖表設定（即時儲存）</span><span><button id="btnReset">還原預設</button> <button id="btnClose">關閉</button></span></div><div class="db" id="dlgBody"></div></dialog>
<div id="toast"></div>

<script>
(()=>{
'use strict';
const $=(s,e=document)=>e.querySelector(s);
const KEY='twmon.v2';
const DEF={
  refresh:5, theme:'dark', scheme:'tw',
  cols:{open:false,high:false,low:false,prev:false,vol:true,bid:false,ask:false},
  chartType:'candle', rtType:'area', lineWidth:1.5, lineColor:'#4f9cf9', bodyRatio:0.7, barsDefault:120,
  grid:true, crosshair:true, lastLine:true, hiLo:true, logScale:false, infoBar:true, prevLine:true,
  ma:[{on:true,p:5,color:'#f5a623'},{on:true,p:10,color:'#4fc3f7'},{on:true,p:20,color:'#ba68c8'},{on:true,p:60,color:'#81c784'}],
  ema:[{on:false,p:12,color:'#ff8a65'},{on:false,p:26,color:'#90a4ae'}],
  boll:{on:false,p:20,k:2,color:'#ffd54f'},
  volume:true,
  macd:{on:false,f:12,s:26,g:9}, kd:{on:false,n:9}, rsi:{on:false,p:14}
};
const TFS=[['rt','分時'],['5d','五日'],['5m','5分'],['15m','15分'],['60m','60分'],['D','日K'],['W','週K'],['M','月K']];
const CTYPES=[['candle','實心K線'],['hollow','空心K線'],['ohlc','美國線'],['line','線圖'],['area','面積圖']];
const IDXN={t00:'加權指數',o00:'櫃買指數'};

function merge(d,s){
  if(Array.isArray(d))return d.map((x,i)=>merge(x,Array.isArray(s)?s[i]:undefined));
  if(d&&typeof d==='object'){const o={};for(const k in d)o[k]=merge(d[k],s&&typeof s==='object'?s[k]:undefined);return o}
  return (s===undefined||s===null)?d:s;
}
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const S=merge(DEF,saved.S);
const st={
  watch:saved.watch||[{code:'2330'},{code:'2317'},{code:'2454'},{code:'2603'},{code:'2881'},{code:'0050'}],
  sel:saved.sel||'2330', tf:saved.tf||'rt', alerts:saved.alerts||{},
  q:{}, last:{}, bars:[], ind:null, prevClose:null, ticks:{}, view:{n:120,end:null}, hover:null, demo:false, L:null
};
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,watch:st.watch,sel:st.sel,tf:st.tf,alerts:st.alerts}))}catch(e){}}

/* ---------- 格式 ---------- */
const pad=n=>String(n).padStart(2,'0');
const tpD=t=>new Date(t*1000+288e5);
const fmtDate=t=>{const d=tpD(t);return d.getUTCFullYear()+'/'+pad(d.getUTCMonth()+1)+'/'+pad(d.getUTCDate())};
const fmtMD=t=>{const d=tpD(t);return pad(d.getUTCMonth()+1)+'/'+pad(d.getUTCDate())};
const fmtHM=t=>{const d=tpD(t);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
const isIntra=tf=>tf==='rt'||tf==='5d'||tf==='5m'||tf==='15m'||tf==='60m';
const fmtP=v=>v==null||isNaN(v)?'--':v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtA=v=>v>=10000?v.toFixed(0):v>=1000?v.toFixed(1):v.toFixed(2);
const fmtV=v=>v==null||isNaN(v)?'--':Math.round(v).toLocaleString('en-US');
const fmtVs=v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(Math.round(v));
const dcls=d=>d>0?'up':d<0?'dn':'fl';
const nameOf=c=>IDXN[c]||(st.q[c]&&st.q[c].name)||c;
function mkt(){const d=new Date(Date.now()+288e5);const day=d.getUTCDay(),m=d.getUTCHours()*60+d.getUTCMinutes();const wk=day>0&&day<6;return{open:wk&&m>=540&&m<=810,wk,m,d}}
function px(q){ // 顯示用價格
  if(!q)return null;
  if(q.price!=null)return q.price;
  return (q.bid&&q.bid[0])||(q.ask&&q.ask[0])||q.prev;
}

/* ---------- 主題 ---------- */
function applyTheme(){
  const r=document.documentElement;r.dataset.theme=S.theme;
  const red='#ef4444',grn='#22c55e';
  r.style.setProperty('--up',S.scheme==='tw'?red:grn);
  r.style.setProperty('--dn',S.scheme==='tw'?grn:red);
}

/* ---------- 後端 API ---------- */
async function api(u){
  const r=await fetch(u);const t=await r.text();
  try{return JSON.parse(t)}catch(e){
    throw new Error('後端沒有回傳 JSON（HTTP '+r.status+'）。請用「python3 main.py」啟動，並開啟終端機顯示的網址（預設 http://127.0.0.1:8765/）；不要直接開 index.html、也不要用 Live Server 或其他靜態伺服器。')}
}

/* ---------- 報價輪詢 ---------- */
let timer=null,status='';
async function pollQuotes(){
  clearTimeout(timer);
  const codes=[...new Set([...st.watch.map(w=>w.code),'t00','o00',st.sel])];
  try{
    const j=await api('/api/quote?codes='+codes.join(','));
    if(j.error)throw new Error(j.error);
    applyQuotes(j.quotes);
    status='ok';
  }catch(e){status='err:'+e.message}
  renderMkt();
  const m=mkt();
  const iv=(!m.open&&!st.demo)?Math.max(S.refresh,15):S.refresh;
  timer=setTimeout(pollQuotes,iv*1000);
}
function applyQuotes(qs){
  for(const c in qs){
    const q=qs[c],old=st.q[c];
    st.last[c]=old?px(old):null;
    const w=st.watch.find(x=>x.code===c);if(w&&q.ex)w.ex=q.ex;
    if(old&&q.vol!==old.vol&&q.tv&&q.price!=null){
      const a=st.ticks[c]||(st.ticks[c]=[]);
      a.unshift({t:q.time,p:q.price,v:q.tv});if(a.length>40)a.pop();
    }
    st.q[c]=q;
    if(c===st.sel)liveBar(q,old&&old.vol!=null&&q.vol!=null?Math.max(0,q.vol-old.vol):0);
  }
  checkAlerts();
  renderWatch();renderIdx();renderHead();renderSide();draw();
}

/* ---------- 即時併入 K 棒 ---------- */
function bk(t,tf){
  if(tf==='rt')return Math.floor(t/60);
  if(tf==='5d'||tf==='5m')return Math.floor(t/300);
  if(tf==='15m')return Math.floor(t/900);
  if(tf==='60m')return Math.floor(t/3600);
  const dn=Math.floor((t+28800)/86400);
  if(tf==='D')return dn;
  if(tf==='W')return Math.floor((dn+3)/7);
  const d=tpD(t);return d.getUTCFullYear()*12+d.getUTCMonth();
}
function liveBar(q,dv){
  if(!q||!st.bars.length&&st.tf!=='rt')return;
  const p=q.price;if(p==null||!q.ts)return;
  const t=Math.floor(q.ts/1000),tf=st.tf;
  {const d=tpD(t),m=d.getUTCHours()*60+d.getUTCMinutes(),wd=d.getUTCDay();if(wd===0||wd===6||m<540||m>815)return} // 非交易時段的報價不併入K棒
  if(tf==='rt'&&st.bars.length&&bk(t,'D')!==bk(st.bars[st.bars.length-1].t,'D'))st.bars=[];
  const intra=isIntra(tf);
  let last=st.bars[st.bars.length-1];
  if(!last||bk(t,tf)>bk(last.t,tf)){
    const size={rt:60,'5d':300,'5m':300,'15m':900,'60m':3600}[tf];
    st.bars.push({t:size?Math.floor(t/size)*size:t,o:p,h:p,l:p,c:p,v:tf==='D'?(q.vol||0):(intra?dv:0)});
  }else if(bk(t,tf)===bk(last.t,tf)){
    last.c=p;if(p>last.h)last.h=p;if(p<last.l)last.l=p;
    if(tf==='D'){if(q.vol!=null)last.v=q.vol;if(q.high!=null)last.h=Math.max(last.h,q.high);if(q.low!=null)last.l=Math.min(last.l,q.low)}
    else if(intra)last.v+=dv;
  }else return;
  recalc();
}

/* ---------- 歷史資料 ---------- */
let histTok=0;
async function loadHistory(){
  const code=st.sel,tf=st.tf,tok=++histTok;
  st.bars=[];st.ind=null;showMsg('載入中…');draw();
  try{
    const q=st.q[code],w=st.watch.find(x=>x.code===code);
    const ex=(q&&q.ex)||(w&&w.ex)||'';
    const j=await api(`/api/history?code=${code}&ex=${ex}&tf=${tf}`);
    if(tok!==histTok)return;
    if(j.error)throw new Error(j.error);
    st.bars=j.bars.map(b=>({t:b[0],o:b[1],h:b[2],l:b[3],c:b[4],v:b[5]}));
    st.prevClose=j.prevClose;st.src=j.source;
    resetView();
    if(st.q[code])liveBar(st.q[code],0);
    recalc();showMsg('');
  }catch(e){if(tok===histTok)showMsg('歷史資料載入失敗：'+e.message+'\n(報價仍會即時更新，可稍後切換週期重試)')}
  draw();
}
function resetView(){st.view.n=Math.max(15,Math.min(S.barsDefault,st.bars.length));st.view.end=null}
function showMsg(t){const m=$('#msg');m.textContent=t;m.style.display=t?'flex':'none';m.style.whiteSpace='pre-line'}

/* ---------- 指標 ---------- */
function SMA(a,p){const r=new Array(a.length).fill(NaN);let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=p)s-=a[i-p];if(i>=p-1)r[i]=s/p}return r}
function EMAr(a,p){const r=[],k=2/(p+1);let e=0;for(let i=0;i<a.length;i++){e=i?a[i]*k+e*(1-k):a[0];r.push(e)}return r}
function EMA(a,p){return EMAr(a,p).map((v,i)=>i>=p-1?v:NaN)}
function BOLL(a,p,k){const m=SMA(a,p),u=[],l=[];for(let i=0;i<a.length;i++){if(isNaN(m[i])){u.push(NaN);l.push(NaN);continue}let s=0;for(let j=i-p+1;j<=i;j++)s+=(a[j]-m[i])**2;const sd=Math.sqrt(s/p);u.push(m[i]+k*sd);l.push(m[i]-k*sd)}return{m,u,l}}
function recalc(){
  const b=st.bars;if(!b.length){st.ind=null;return}
  const c=b.map(x=>x.c),I={};
  I.ma=S.ma.map(x=>x.on?SMA(c,Math.max(1,x.p)):null);
  I.ema=S.ema.map(x=>x.on?EMA(c,Math.max(1,x.p)):null);
  I.boll=S.boll.on?BOLL(c,Math.max(2,S.boll.p),S.boll.k):null;
  if(S.macd.on){const f=EMAr(c,S.macd.f),s=EMAr(c,S.macd.s),dif=f.map((v,i)=>v-s[i]),dea=EMAr(dif,S.macd.g);I.macd={dif,dea,osc:dif.map((v,i)=>v-dea[i])}}
  if(S.kd.on){const n=Math.max(1,S.kd.n),K=[],D=[];let k=50,d=50;for(let i=0;i<b.length;i++){let hh=-Infinity,ll=Infinity;for(let j=Math.max(0,i-n+1);j<=i;j++){hh=Math.max(hh,b[j].h);ll=Math.min(ll,b[j].l)}const rsv=hh===ll?50:(b[i].c-ll)/(hh-ll)*100;k=2/3*k+rsv/3;d=2/3*d+k/3;K.push(k);D.push(d)}I.kd={k:K,d:D}}
  if(S.rsi.on){const p=Math.max(1,S.rsi.p),r=new Array(c.length).fill(NaN);let ag=0,al=0;for(let i=1;i<c.length;i++){const ch=c[i]-c[i-1],g=Math.max(ch,0),l=Math.max(-ch,0);if(i<=p){ag+=g/p;al+=l/p}else{ag=(ag*(p-1)+g)/p;al=(al*(p-1)+l)/p}if(i>=p)r[i]=al===0?100:100-100/(1+ag/al)}I.rsi=r}
  st.ind=I;
}

/* ---------- 繪圖 ---------- */
function draw(){
  const cv=$('#cv'),par=cv.parentElement,dpr=window.devicePixelRatio||1,W=par.clientWidth,H=par.clientHeight;
  if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px'}

  cv.addEventListener('mouseleave',()=>{st.hover=null;drag=null;redraw()});
  cv.addEventListener('mousedown',e=>{const r=cv.getBoundingClientRect();drag={x:e.clientX-r.left,end:st.view.end==null?st.bars.length:st.view.end};cv.style.cursor='grabbing'});
  window.addEventListener('mouseup',()=>{drag=null;cv.style.cursor='crosshair'});
  cv.addEventListener('wheel',e=>{
    e.preventDefault();const L=st.L;if(!L||L.rt)return;
    const r=cv.getBoundingClientRect(),fx=Math.max(0,Math.min(1,(e.clientX-r.left-L.padL)/L.plotW));
    const n0=st.view.n,len=st.bars.length,n1=Math.max(15,Math.min(len,Math.round(n0*(e.deltaY>0?1.15:0.87))));
    if(n1===n0)return;
    const end0=st.view.end==null?len:st.view.end,anchor=end0-n0+fx*n0,start1=anchor-fx*n1;
    st.view.n=n1;st.view.end=Math.max(n1,Math.min(len,Math.round(start1+n1)));if(st.view.end>=len)st.view.end=null;
    st.hover=null;redraw();
  },{passive:false});
  cv.addEventListener('dblclick',()=>{resetView();draw()});
  new ResizeObserver(()=>draw()).observe(cv.parentElement);
})();

/* ---------- 畫面 ---------- */
function renderMkt(){
  const m=mkt(),el=$('#mkt'),d=m.d;
  const clock=`${d.getUTCFullYear()}/${pad(d.getUTCMonth()+1)}/${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} (台北)`;
  let s=m.open?'<i class="o"></i>盤中':(m.wk?(m.m<540?'<i></i>盤前':'<i></i>已收盤'):'<i></i>休市');
  if(st.demo)s='<i class="o"></i>示範';
  const e=status.startsWith('err')?` <span class="up" title="${status.slice(4).replace(/"/g,'')}">⚠ 連線失敗</span>`:'';
  el.innerHTML=s+' · '+clock+e;
}
function renderIdx(){
  $('#idx').innerHTML=['t00','o00'].map(c=>{
    const q=st.q[c];if(!q)return `<div class="ix"><b>${IDXN[c]}</b>…</div>`;
    const p=px(q),ch=p-q.prev,pc=ch/q.prev*100,k=dcls(ch);
    return `<div class="ix" data-c="${c}"><b>${c==='t00'?'加權':'櫃買'}</b><span class="num ${k}">${fmtP(p)}</span><span class="num ${k}">${ch>0?'▲':ch<0?'▼':''}${Math.abs(ch).toFixed(2)} (${pc.toFixed(2)}%)</span></div>`;
  }).join('');
}
function renderWatch(){
  const C=S.cols;
  let h='<tr><th>名稱 / 代號</th><th>成交</th><th>漲跌</th><th>幅度</th>'+
    (C.open?'<th>開</th>':'')+(C.high?'<th>高</th>':'')+(C.low?'<th>低</th>':'')+(C.prev?'<th>昨收</th>':'')+(C.bid?'<th>買進</th>':'')+(C.ask?'<th>賣出</th>':'')+(C.vol?'<th>量(張)</th>':'')+'<th></th></tr>';
  for(const w of st.watch){
    const q=st.q[w.code];
    if(!q){h+=`<tr class="r${w.code===st.sel?' sel':''}" data-c="${w.code}"><td>${w.code}</td><td colspan="9" style="color:var(--muted);text-align:left">讀取中…(若持續無資料請確認代號)</td><td class="x"><span data-x="${w.code}">✕</span></td></tr>`;continue}
    const p=px(q),ch=p-q.prev,pc=q.prev?ch/q.prev*100:0,k=dcls(ch),lp=st.last[w.code];
    const fl=lp!=null&&p!==lp?(p>lp?'flu':'fld'):'';
    const lim=q.up&&p>=q.up?'<span class="lim u">漲停</span>':q.down&&p<=q.down?'<span class="lim d">跌停</span>':'';
    h+=`<tr class="r${w.code===st.sel?' sel':''}" data-c="${w.code}"><td>${q.name}<span class="c">${w.code}</span>${lim}</td>`+
      `<td class="num ${k} ${fl}"><b>${fmtP(p)}</b></td><td class="num ${k}">${ch>0?'▲':ch<0?'▼':''}${Math.abs(ch).toFixed(2)}</td><td class="num ${k}">${pc>0?'+':''}${pc.toFixed(2)}%</td>`+
      (C.open?`<td class="num ${dcls(q.open-q.prev)}">${fmtP(q.open)}</td>`:'')+(C.high?`<td class="num ${dcls(q.high-q.prev)}">${fmtP(q.high)}</td>`:'')+(C.low?`<td class="num ${dcls(q.low-q.prev)}">${fmtP(q.low)}</td>`:'')+(C.prev?`<td class="num">${fmtP(q.prev)}</td>`:'')+
      (C.bid?`<td class="num">${fmtP(q.bid&&q.bid[0])}</td>`:'')+(C.ask?`<td class="num">${fmtP(q.ask&&q.ask[0])}</td>`:'')+(C.vol?`<td class="num">${fmtV(q.vol)}</td>`:'')+
      `<td class="x"><span data-x="${w.code}" title="移除">✕</span></td></tr>`;
  }
  $('#wl').innerHTML=h;
}
function renderHead(){
  const q=st.q[st.sel];
  if(!q){$('#head').innerHTML='<div class="hn"><b>'+st.sel+'</b> 讀取中…</div>';return}
  const p=px(q),ch=p-q.prev,pc=q.prev?ch/q.prev*100:0,k=dcls(ch),idx=!!IDXN[q.code];
  const t=q.time?q.time:'--';
  $('#head').innerHTML=`<div class="hn"><b>${idx?IDXN[q.code]:q.name}</b><span>${q.code}</span>${idx?'':`<em>${q.ex==='otc'?'上櫃':'上市'}</em>`}</div>
   <div class="hp num ${k}">${fmtP(p)}</div><div class="hc num ${k}">${ch>0?'▲':ch<0?'▼':''} ${Math.abs(ch).toFixed(2)} (${pc>0?'+':''}${pc.toFixed(2)}%)</div>
   <div class="stats num"><div>開<b class="${dcls(q.open-q.prev)}">${fmtP(q.open)}</b></div><div>高<b class="up">${fmtP(q.high)}</b></div><div>低<b class="dn">${fmtP(q.low)}</b></div><div>昨收<b>${fmtP(q.prev)}</b></div>${idx?'':`<div>量(張)<b>${fmtV(q.vol)}</b></div><div>漲停<b>${fmtP(q.up)}</b></div><div>跌停<b>${fmtP(q.down)}</b></div>`}<div>時間<b>${t}</b></div></div>`;
}
function renderSide(){
  const q=st.q[st.sel];const el=$('#side');
  if(!q){el.innerHTML='';return}
  let h='';
  if(q.bid&&q.bid.length||q.ask&&q.ask.length){
    const mx=Math.max(1,...(q.askVol||[]),...(q.bidVol||[]));
    const row=(lab,p,v,cl)=>`<div class="dr ${cl}"><span class="dl">${lab}</span><span class="dp num ${dcls(p-q.prev)}">${fmtP(p)}</span><span class="dv num">${fmtV(v)}</span><i style="width:${(v||0)/mx*100}%"></i></div>`;
    h+='<div class="sh">最佳五檔</div>';
    for(let i=Math.min(4,(q.ask||[]).length-1);i>=0;i--)h+=row('賣'+(i+1),q.ask[i],q.askVol[i],'dn');
    h+='<div style="height:1px;background:var(--line);margin:3px 0"></div>';
    for(let i=0;i<Math.min(5,(q.bid||[]).length);i++)h+=row('買'+(i+1),q.bid[i],q.bidVol[i],'up');
  }
  const tk=st.ticks[st.sel]||[];
  h+='<div class="sh" style="margin-top:6px">成交明細 (輪詢取樣)</div>';
  if(!tk.length)h+='<div style="padding:8px 10px;color:var(--muted)">等待成交…</div>';
  tk.slice(0,18).forEach((x,i)=>{const pv=tk[i+1]?tk[i+1].p:q.prev;h+=`<div class="tk num"><span style="color:var(--muted)">${x.t}</span><span class="${dcls(x.p-pv)}">${fmtP(x.p)}</span><span>${fmtV(x.v)}</span></div>`});
  el.innerHTML=h;
}
function renderToolbar(){
  const anyMA=S.ma.some(m=>m.on);
  const chip=(id,l,on)=>`<button class="${on?'on':''}" data-chip="${id}">${l}</button>`;
  $('#tb').innerHTML=`<div class="g">${TFS.map(([k,l])=>`<button class="${st.tf===k?'on':''}" data-tf="${k}">${l}</button>`).join('')}</div>
  <div class="g"><select id="ctSel" title="圖表類型">${CTYPES.map(([k,l])=>`<option value="${k}"${S.chartType===k?' selected':''}>${l}</option>`).join('')}</select></div>
  <div class="g chips">${chip('ma','均線',anyMA)}${chip('boll','布林',S.boll.on)}${chip('vol','成交量',S.volume)}${chip('macd','MACD',S.macd.on)}${chip('kd','KD',S.kd.on)}${chip('rsi','RSI',S.rsi.on)}</div>
  <div class="g"><button data-act="reset">↺ 重設縮放</button></div>
  <span style="margin-left:auto;color:var(--muted);font-size:12px" id="srcTag"></span>`;
  $('#srcTag').textContent=(st.src?('歷史：'+st.src+' · '):'')+'滾輪縮放 / 拖曳平移 / 雙擊還原';
}
function renderAlertBox(){
  const a=st.alerts[st.sel]||{};
  $('#alertBox').innerHTML=`🔔 到價提醒　漲到 ≥ <input id="alUp" type="number" step="0.01" value="${a.above??''}" placeholder="價格"> 跌到 ≤ <input id="alDn" type="number" step="0.01" value="${a.below??''}" placeholder="價格"> <button id="alSet">設定</button>`+
    (a.above!=null?`<span class="tag" data-clr="above">≥${a.above} ✕</span>`:'')+(a.below!=null?`<span class="tag" data-clr="below">≤${a.below} ✕</span>`:'');
}
function toast(msg){const d=document.createElement('div');d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),9000)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}
function checkAlerts(){
  let ch=false;
  for(const c in st.alerts){
    const a=st.alerts[c],q=st.q[c],p=q&&q.price;if(p==null)continue;
    const fire=m=>{const s=`${nameOf(c)} ${c} ${m} (現價 ${fmtP(p)})`;toast('🔔 '+s);beep();try{if(window.Notification&&Notification.permission==='granted')new Notification('台股到價提醒',{body:s})}catch(e){}ch=true};
    if(a.above!=null&&p>=a.above){fire('已漲到 ≥ '+a.above);a.above=null}
    if(a.below!=null&&p<=a.below){fire('已跌到 ≤ '+a.below);a.below=null}
    if(a.above==null&&a.below==null)delete st.alerts[c];
  }
  if(ch){save();renderAlertBox()}
}

/* ---------- 事件 ---------- */
function select(c){
  if(st.sel===c&&st.bars.length)return;
  st.sel=c;st.hover=null;save();renderAlertBox();renderWatch();renderHead();renderSide();loadHistory();
  if(!st.q[c])pollQuotes();
}
$('#wl').addEventListener('click',e=>{
  const x=e.target.closest('[data-x]');
  if(x){const c=x.dataset.x;st.watch=st.watch.filter(w=>w.code!==c);if(st.sel===c&&st.watch.length)select(st.watch[0].code);save();renderWatch();e.stopPropagation();return}
  const r=e.target.closest('tr.r');if(r)select(r.dataset.c);
});
$('#idx').addEventListener('click',e=>{const x=e.target.closest('.ix');if(x&&x.dataset.c)select(x.dataset.c)});
$('#tb').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tf){st.tf=b.dataset.tf;save();renderToolbar();loadHistory();return}
  if(b.dataset.act==='reset'){resetView();draw();return}
  const c=b.dataset.chip;
  if(c==='ma'){const on=!S.ma.some(m=>m.on);S.ma.forEach(m=>m.on=on)}
  else if(c==='boll')S.boll.on=!S.boll.on;
  else if(c==='vol')S.volume=!S.volume;
  else if(c)S[c].on=!S[c].on;
  changed();
});
$('#tb').addEventListener('change',e=>{if(e.target.id==='ctSel'){S.chartType=e.target.value;changed()}});
$('#alertBox').addEventListener('click',e=>{
  if(e.target.id==='alSet'){
    const up=parseFloat($('#alUp').value),dn=parseFloat($('#alDn').value);
    const a={above:isNaN(up)?null:up,below:isNaN(dn)?null:dn};
    if(a.above==null&&a.below==null)delete st.alerts[st.sel];else st.alerts[st.sel]=a;
    save();renderAlertBox();toast('已設定提醒');
    try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  }
  const t=e.target.closest('[data-clr]');
  if(t){const a=st.alerts[st.sel];if(a){a[t.dataset.clr]=null;if(a.above==null&&a.below==null)delete st.alerts[st.sel];save();renderAlertBox()}}
});
/* 搜尋/新增 */
const addIn=$('#addIn'),sug=$('#sug');let sugT,sugRes=[];
function addStock(code,ex){
  code=code.toUpperCase();
  if(!st.watch.some(w=>w.code===code))st.watch.push({code,ex});
  addIn.value='';sug.style.display='none';save();renderWatch();pollQuotes();select(code);
}
addIn.addEventListener('input',()=>{
  clearTimeout(sugT);
  sugT=setTimeout(async()=>{
    const v=addIn.value.trim();if(!v){sug.style.display='none';return}
    try{const j=await api('/api/search?q='+encodeURIComponent(v));sugRes=j.results||[];
      sug.innerHTML=sugRes.map(r=>`<div data-c="${r.code}" data-e="${r.ex}"><span>${r.code} ${r.name}</span><small>${r.ex==='otc'?'上櫃':'上市'}</small></div>`).join('');
      sug.style.display=sugRes.length?'block':'none'}catch(e){}
  },180);
});
addIn.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=addIn.value.trim();if(sugRes.length&&sug.style.display!=='none')addStock(sugRes[0].code,sugRes[0].ex);else if(/^[0-9A-Za-z]{2,8}$/.test(v))addStock(v)}
  if(e.key==='Escape')sug.style.display='none';
});
sug.addEventListener('click',e=>{const d=e.target.closest('div[data-c]');if(d)addStock(d.dataset.c,d.dataset.e)});
document.addEventListener('click',e=>{if(!e.target.closest('.add'))sug.style.display='none'});
$('#refSel').value=String(S.refresh);
$('#refSel').addEventListener('change',e=>{S.refresh=+e.target.value;save();pollQuotes()});
$('#btnTheme').addEventListener('click',()=>{S.theme=S.theme==='dark'?'light':'dark';changed()});

/* ---------- 設定面板 ---------- */
const dlg=$('#dlg'),body=$('#dlgBody');
const getP=p=>p.split('.').reduce((o,k)=>o[k],S);
function setP(p,v){const ks=p.split('.'),l=ks.pop();ks.reduce((o,k)=>o[k],S)[l]=v}
const chk=(p,l)=>`<div class="f"><label class="k"><input type="checkbox" data-p="${p}" ${getP(p)?'checked':''}>${l}</label></div>`;
const num=(p,l,min,max,step)=>`<div class="f"><span>${l}</span><input type="number" data-p="${p}" value="${getP(p)}" min="${min}" max="${max}" step="${step||1}"></div>`;
const col=(p,l)=>`<div class="f"><span>${l}</span><input type="color" data-p="${p}" value="${getP(p)}"></div>`;
const sel=(p,l,opts)=>`<div class="f"><span>${l}</span><select data-p="${p}">${opts.map(([v,t])=>`<option value="${v}"${getP(p)==v?' selected':''}>${t}</option>`).join('')}</select></div>`;
function buildDlg(){
  const line=(arr,i,name)=>`<div class="row"><label class="k"><input type="checkbox" data-p="${arr}.${i}.on" ${getP(arr+'.'+i+'.on')?'checked':''}> <span class="n">${name}${i+1}</span></label>週期 <input type="number" data-p="${arr}.${i}.p" min="1" max="500" value="${getP(arr+'.'+i+'.p')}"> 顏色 <input type="color" data-p="${arr}.${i}.color" value="${getP(arr+'.'+i+'.color')}"></div>`;
  body.innerHTML=`
  <h4>一般</h4><div class="grid">
   ${sel('theme','介面主題',[['dark','暗色'],['light','亮色']])}
   ${sel('scheme','漲跌顏色',[['tw','台股：紅漲綠跌'],['us','美股：綠漲紅跌']])}
   ${num('refresh','報價更新(秒)',2,120)}
  </div>
  <h4>自選股表格欄位</h4><div class="grid">
   ${chk('cols.open','開盤')}${chk('cols.high','最高')}${chk('cols.low','最低')}${chk('cols.prev','昨收')}${chk('cols.bid','買進價')}${chk('cols.ask','賣出價')}${chk('cols.vol','成交量(張)')}
  </div>
  <h4>線圖外觀</h4><div class="grid">
   ${sel('chartType','K線類型',CTYPES)}
   ${sel('rtType','分時圖樣式',[['area','面積'],['line','線']])}
   ${num('lineWidth','線寬',0.5,4,0.5)}
   ${col('lineColor','線圖顏色')}
   ${num('bodyRatio','K棒寬度比例',0.2,1,0.05)}
   ${num('barsDefault','預設顯示K棒數',20,500,10)}
   ${chk('grid','顯示格線')}${chk('crosshair','十字游標')}${chk('infoBar','顯示資訊列(OHLC/均線值)')}
   ${chk('lastLine','現價虛線')}${chk('hiLo','標示區間最高/最低')}${chk('logScale','對數座標(K線)')}
  </div>
  <h4>主圖疊加：移動平均線 (SMA)</h4>${S.ma.map((_,i)=>line('ma',i,'MA')).join('')}
  <h4>主圖疊加：指數移動平均線 (EMA)</h4>${S.ema.map((_,i)=>line('ema',i,'EMA')).join('')}
  <h4>主圖疊加：布林通道</h4><div class="grid">${chk('boll.on','啟用')}${num('boll.p','週期',2,200)}${num('boll.k','標準差倍數',0.5,5,0.5)}${col('boll.color','顏色')}</div>
  <h4>副圖指標</h4><div class="grid">
   ${chk('volume','成交量')}<span></span><span></span>
   ${chk('macd.on','MACD')}${num('macd.f','快線',1,100)}${num('macd.s','慢線',1,200)}${num('macd.g','訊號線',1,100)}
   ${chk('kd.on','KD 隨機指標')}${num('kd.n','週期',1,100)}<span></span>
   ${chk('rsi.on','RSI')}${num('rsi.p','週期',1,100)}
  </div>`;
}
function changed(){save();applyTheme();recalc();renderToolbar();renderWatch();renderIdx();$('#refSel').value=String(S.refresh);draw()}
dlg.addEventListener('input',e=>{
  const t=e.target,p=t.dataset&&t.dataset.p;if(!p)return;
  let v=t.type==='checkbox'?t.checked:t.type==='number'?parseFloat(t.value):t.value;
  if(t.type==='number'){if(isNaN(v))return;if(t.min!==''&&v<+t.min)v=+t.min;if(t.max!==''&&v>+t.max)v=+t.max}
  if(t.tagName==='SELECT'&&typeof getP(p)==='number')v=+v;
  const oldRef=S.refresh;setP(p,v);
  if(p==='barsDefault'){resetView()}
  changed();if(S.refresh!==oldRef)pollQuotes();
});
$('#btnSet').addEventListener('click',()=>{buildDlg();dlg.showModal()});
$('#btnClose').addEventListener('click',()=>dlg.close());
$('#btnReset').addEventListener('click',()=>{const d=JSON.parse(JSON.stringify(DEF));Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,d);buildDlg();changed();resetView();pollQuotes()});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* ---------- 啟動 ---------- */
applyTheme();renderToolbar();renderWatch();renderAlertBox();renderMkt();
api('/api/info').then(j=>{st.demo=!!j.demo;if(st.demo)$('#demoTag').style.display='inline-block';else if(j.source==='sinopac'){const t=$('#demoTag');t.textContent='永豐 API';t.style.background='#22c55e';t.style.color='#fff';t.style.display='inline-block'}renderMkt()}).catch(()=>{});
pollQuotes();loadHistory();
setInterval(renderMkt,1000);
window.addEventListener('resize',draw);
})();
</script>
</body>
</html>
